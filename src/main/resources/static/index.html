<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quota Platform · Dashboard</title>
<style>
:root{--bg:#0b1020;--panel:#131a2e;--panel2:#1a2340;--line:#27325a;--text:#e8ecff;--muted:#8f9bc7;--brand:#6c8cff;--brand2:#9a6cff;--ok:#2ecc9a;--warn:#ffb84d;--err:#ff5d73;--radius:14px;--shadow:0 10px 30px rgba(0,0,0,.35)}
[data-theme=light]{--bg:#f3f5fb;--panel:#fff;--panel2:#f0f3ff;--line:#dfe4f5;--text:#14193a;--muted:#5f6a94;--shadow:0 10px 30px rgba(40,60,120,.12)}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:800}
.users{display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1}
.user{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid transparent;border-radius:12px;background:transparent;color:inherit;text-align:left;width:100%}
.user:hover{background:var(--panel2)}.user.active{background:var(--panel2);border-color:var(--brand)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;flex:none}
.user small{color:var(--muted);display:block}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;letter-spacing:.02em}
.b-FREE{background:#2b355f;color:#b7c3ff}.b-PRO{background:#2a3f8f;color:#cfd9ff}.b-ENTERPRISE{background:#5a2f8f;color:#ecd9ff}
.b-ACTIVE{background:rgba(46,204,154,.15);color:var(--ok)}.b-EXPIRED{background:rgba(255,93,115,.15);color:var(--err)}
main{padding:28px;display:flex;flex-direction:column;gap:20px;max-width:1200px;width:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px}h2{margin:0 0 12px;font-size:15px}.muted{color:var(--muted)}
.row{display:grid;gap:20px}.r2{grid-template-columns:340px 1fr}.r3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--brand)}.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;color:#fff}
.btn.danger{color:var(--err)}.btn:disabled{opacity:.45;cursor:not-allowed}
.ring{position:relative;width:200px;height:200px;margin:4px auto 12px}
.ring svg{transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-size:30px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border-radius:10px;padding:10px}.stat b{display:block;font-size:16px}
.plan{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.plan.current{border-color:var(--brand);box-shadow:0 0 0 2px rgba(108,140,255,.25)}
.price{font-size:22px;font-weight:800}.plan ul{margin:6px 0;padding-left:18px;color:var(--muted)}
.sim{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:12px}
.pager{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px}
.empty{padding:40px;text-align:center;color:var(--muted)}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:50}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);padding:12px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:380px;animation:in .2s}
.toast.err{border-left-color:var(--err)}.toast.ok{border-left-color:var(--ok)}.toast code{font-size:11px;color:var(--muted);display:block}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:22px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}dialog form{display:flex;flex-direction:column;gap:12px}
@keyframes in{from{transform:translateY(10px);opacity:0}}
@media(max-width:980px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.users{flex-direction:row;overflow:auto}.user{min-width:210px}.r2,.r3{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.chip:hover{border-color:var(--brand)}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
aside input[type=search]{width:100%}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">Q</div>Quota Platform</div>
    <button class="btn primary" id="newUserBtn">+ Yeni Kullanıcı</button>
    <input id="search" type="search" placeholder="Ara: ad veya e-posta" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="users" id="users"></div>
    <div class="muted" style="font-size:12px">
      <a href="/swagger-ui.html" target="_blank" style="color:var(--brand)">Swagger UI ↗</a>
      &nbsp;·&nbsp; <button class="btn" id="themeBtn" style="padding:2px 8px">Tema</button>
    </div>
  </aside>

  <main id="main"><div class="empty">Soldan bir kullanıcı seçin veya yeni kullanıcı oluşturun.</div></main>
</div>

<dialog id="userDialog">
  <form method="dialog" id="userForm">
    <h2>Yeni kullanıcı</h2>
    <label>Ad Soyad<input name="fullName" required maxlength="120"></label>
    <label>E-posta<input name="email" type="email" required maxlength="180"></label>
    <label>Başlangıç paketi<select name="planType"><option>FREE</option><option>PRO</option><option>ENTERPRISE</option></select></label>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" value="cancel" formnovalidate>İptal</button>
      <button class="btn primary" value="ok">Oluştur</button>
    </div>
  </form>
</dialog>
<div id="toasts"></div>

<script>
const API = '/api/v1';
const fmt = n => new Intl.NumberFormat('tr-TR').format(n);
const fmtDate = s => new Date(s).toLocaleString('tr-TR', {dateStyle: 'medium', timeStyle: 'short'});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const state = {users: [], plans: [], userId: null, sub: null, logs: null, daily: [], page: 0, q: '', plan: 'ALL'};

async function api(path, opts = {}) {
  const res = await fetch(API + path, {headers: {'Content-Type': 'application/json'}, ...opts});
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) { const e = new Error(data?.message || res.statusText); e.code = data?.code; e.status = res.status; e.details = data?.validationErrors; throw e; }
  return data;
}
function toast(msg, type = 'ok', code = '') {
  const t = document.createElement('div'); t.className = 'toast ' + type;
  t.innerHTML = `<b>${esc(msg)}</b>${code ? `<code>${esc(code)}</code>` : ''}`;
  $('toasts').append(t); setTimeout(() => t.remove(), 5000);
}
const fail = e => toast(e.message, 'err', e.code || '');

async function loadUsers() { state.users = await api('/users'); renderUsers(); }
function renderUsers() {
  renderChips();
  $('users').innerHTML = visibleUsers().map(u => `
    <button class="user ${u.id === state.userId ? 'active' : ''}" data-id="${u.id}">
      <span class="avatar">${esc(u.fullName.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase())}</span>
      <span><b>${esc(u.fullName)}</b><small>${esc(u.email)}</small>
      <span class="badge b-${u.planType}">${u.planType}</span> <span class="badge b-${u.subscriptionStatus}">${u.subscriptionStatus}</span></span>
    </button>`).join('') || '<div class="empty">Eşleşen kullanıcı yok</div>';
  document.querySelectorAll('.user').forEach(b => b.onclick = () => selectUser(+b.dataset.id));
}
function visibleUsers() {
  return state.users.filter(u =>
    (state.plan === 'ALL' || u.planType === state.plan) &&
    (!state.q || u.fullName.toLowerCase().includes(state.q) || u.email.toLowerCase().includes(state.q)));
}
function renderChips() {
  const count = p => p === 'ALL' ? state.users.length : state.users.filter(u => u.planType === p).length;
  $('chips').innerHTML = ['ALL', 'FREE', 'PRO', 'ENTERPRISE'].map(p =>
    `<button class="chip ${state.plan === p ? 'on' : ''}" data-p="${p}">${p === 'ALL' ? 'Tümü' : p} ${count(p)}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { state.plan = b.dataset.p; renderUsers(); });
}
async function selectUser(id) { state.userId = id; state.page = 0; renderUsers(); await refresh(); }
async function refresh() {
  if (!state.userId) return;
  try {
    [state.sub, state.logs, state.daily] = await Promise.all([
      api(`/users/${state.userId}/subscription`),
      api(`/users/${state.userId}/usage/logs?page=${state.page}&size=8`),
      api(`/users/${state.userId}/usage/daily`)]);
    state.users = await api('/users'); renderUsers(); renderMain();
  } catch (e) { fail(e); }
}

function renderMain() {
  const u = state.users.find(x => x.id === state.userId), s = state.sub;
  const pct = s.monthlyLimit ? Math.min(100, s.usedThisMonth / s.monthlyLimit * 100) : 0;
  const color = pct >= 90 ? 'var(--err)' : pct >= 70 ? 'var(--warn)' : 'var(--brand)';
  const R = 84, C = 2 * Math.PI * R, expired = s.status === 'EXPIRED';
  $('main').innerHTML = `
  <header>
    <div><h1>${esc(u.fullName)}</h1><span class="muted">${esc(u.email)} · dönem ${esc(s.period)}</span></div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="badge b-${s.planType}">${s.planType}</span><span class="badge b-${s.status}">${s.status}</span>
      <button class="btn danger" id="expireBtn" ${expired ? 'disabled' : ''}>Aboneliği sonlandır (demo)</button>
      <button class="btn primary" id="renewBtn" ${expired ? '' : 'disabled'}>Yenile</button>
    </div>
  </header>

  <div class="row r2">
    <section class="card">
      <h2>Aylık kota kullanımı</h2>
      <div class="ring">
        <svg width="200" height="200"><circle cx="100" cy="100" r="${R}" stroke="var(--line)" stroke-width="14" fill="none"/>
        <circle cx="100" cy="100" r="${R}" stroke="${color}" stroke-width="14" fill="none" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}" style="transition:stroke-dashoffset .6s"/></svg>
        <div class="c"><b>%${pct.toFixed(1)}</b><span class="muted">${fmt(s.usedThisMonth)} / ${fmt(s.monthlyLimit)}</span></div>
      </div>
      <div class="stats">
        <div class="stat"><span class="muted">Kalan</span><b>${fmt(s.remaining)}</b></div>
        <div class="stat"><span class="muted">Bitiş</span><b style="font-size:13px">${fmtDate(s.endDate)}</b></div>
      </div>
    </section>

    <section class="card">
      <h2>API simülatörü</h2>
      <p class="muted" style="margin-top:0">Her çağrı bir <code>UsageLog</code> kaydı oluşturur ve kotadan düşer. Limit aşımında <b>QUOTA_EXCEEDED</b>, süresi dolmuşsa <b>SUBSCRIPTION_EXPIRED</b> döner.</p>
      <div class="sim">
        <label>Operasyon<select id="op"><option>/v1/summarize</option><option>/v1/translate</option><option>/v1/embedding</option><option>/v1/classify</option></select></label>
        <label>Birim<input id="units" type="number" min="1" max="100000" value="1" style="width:100px"></label>
        <button class="btn primary" id="sendBtn">İstek gönder</button>
        <button class="btn" id="burstBtn">10 istek (burst)</button>
      </div>
      <h2 style="margin-top:22px">Paketler</h2>
      <div class="row r3">${state.plans.map(p => planCard(p, s)).join('')}</div>
    </section>
  </div>

  <section class="card">
    <h2>Günlük kullanım · ${esc(s.period)}</h2>
    ${dailyChart(s)}
  </section>

  <section class="card">
    <h2>Kullanım geçmişi</h2>
    ${state.logs.content.length ? `<table><thead><tr><th>#</th><th>Operasyon</th><th>Birim</th><th>Dönem</th><th>Zaman</th></tr></thead><tbody>
      ${state.logs.content.map(l => `<tr><td>${l.id}</td><td>${esc(l.operation)}</td><td>${fmt(l.quotaUsed)}</td><td>${esc(l.period)}</td><td>${fmtDate(l.createdAt)}</td></tr>`).join('')}
    </tbody></table>
    <div class="pager"><span class="muted">Sayfa ${state.logs.page + 1} / ${Math.max(1, state.logs.totalPages)} · ${fmt(state.logs.totalElements)} kayıt</span>
      <button class="btn" id="prevBtn" ${state.page === 0 ? 'disabled' : ''}>‹</button>
      <button class="btn" id="nextBtn" ${state.page + 1 >= state.logs.totalPages ? 'disabled' : ''}>›</button></div>`
    : '<div class="empty">Bu kullanıcı henüz kota harcamadı.</div>'}
  </section>`;
  bind();
}
function dailyChart(s) {
  if (!state.daily.length) return '<div class="empty">Bu ay henüz kullanım yok.</div>';
  const [y, m] = s.period.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const perDay = Object.fromEntries(state.daily.map(d => [+d.date.slice(8, 10), d.units]));
  const max = Math.max(1, ...Object.values(perDay));
  const total = Object.values(perDay).reduce((a, b) => a + b, 0);
  const W = 720, H = 180, pad = 24, bw = (W - pad * 2) / days;
  let bars = '';
  for (let d = 1; d <= days; d++) {
    const v = perDay[d] || 0, h = v / max * (H - pad * 2), x = pad + (d - 1) * bw;
    bars += `<rect x="${x + 2}" y="${H - pad - h}" width="${Math.max(2, bw - 4)}" height="${v ? Math.max(h, 2) : 0}" rx="3" fill="var(--brand)"><title>${d}. gün: ${fmt(v)} birim</title></rect>`;
    if (d === 1 || d % 5 === 0) bars += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Günlük kullanım grafiği">
    <line x1="${pad}" y1="${H - pad}" x2="${W - pad}" y2="${H - pad}" stroke="var(--line)"/>${bars}</svg>
    <div class="muted" style="margin-top:6px">Toplam ${fmt(total)} birim · en yüksek gün ${fmt(max)} birim</div>`;
}
function planCard(p, s) {
  const cur = p.type === s.planType;
  const dir = p.monthlyLimit > s.monthlyLimit ? 'Yükselt' : 'Düşür';
  return `<div class="plan ${cur ? 'current' : ''}"><b>${p.type}</b>
    <div class="price">$${p.monthlyPrice}<span class="muted" style="font-size:12px">/ay</span></div>
    <ul><li>${fmt(p.monthlyLimit)} çağrı / ay</li></ul>
    <button class="btn ${cur ? '' : 'primary'}" data-plan="${p.type}" ${cur ? 'disabled' : ''}>${cur ? 'Mevcut paket' : dir}</button></div>`;
}
function bind() {
  $('sendBtn').onclick = () => send(+$('units').value || 1);
  $('burstBtn').onclick = async () => { for (let i = 0; i < 10; i++) { if (!await send(+$('units').value || 1, true)) break; } refresh(); };
  $('expireBtn').onclick = () => act('/subscription/expire', {method: 'POST'}, 'Abonelik sonlandırıldı');
  $('renewBtn').onclick = () => act('/subscription/renew', {method: 'POST'}, 'Abonelik yenilendi');
  document.querySelectorAll('[data-plan]').forEach(b => b.onclick = () =>
    act('/subscription/plan', {method: 'PUT', body: JSON.stringify({planType: b.dataset.plan})}, 'Paket değiştirildi: ' + b.dataset.plan));
  $('prevBtn')?.addEventListener('click', () => { state.page--; refresh(); });
  $('nextBtn')?.addEventListener('click', () => { state.page++; refresh(); });
}
async function send(units, silent = false) {
  try {
    const r = await api(`/users/${state.userId}/usage`, {method: 'POST', body: JSON.stringify({operation: $('op').value, units})});
    if (!silent) { toast(`${r.operation} · ${units} birim`, 'ok', `kalan: ${fmt(r.remaining)}`); await refresh(); }
    return true;
  } catch (e) { fail(e); await refresh(); return false; }
}
async function act(path, opts, okMsg) {
  try { await api(`/users/${state.userId}${path}`, opts); toast(okMsg); await refresh(); } catch (e) { fail(e); }
}

$('newUserBtn').onclick = () => $('userDialog').showModal();
$('userForm').addEventListener('submit', async ev => {
  if (ev.submitter?.value !== 'ok') return;
  const f = Object.fromEntries(new FormData(ev.target));
  try { const u = await api('/users', {method: 'POST', body: JSON.stringify(f)}); ev.target.reset(); toast('Kullanıcı oluşturuldu'); await loadUsers(); selectUser(u.id); }
  catch (e) { fail(e); }
});
$('themeBtn').onclick = () => { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('theme', h.dataset.theme); };
document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

$('search').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); renderUsers(); });

(async () => {
  try { state.plans = await api('/plans'); await loadUsers(); if (state.users.length) selectUser(state.users[0].id); }
  catch (e) { fail(e); }
})();
</script>
</body>
</html>
