spring:
  application:
    name: quota-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5544/quota_platform}
    username: ${DB_USER:quota}
    password: ${DB_PASSWORD:quota}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8085}
  error:
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  seed-demo: ${SEED_DEMO:true}
