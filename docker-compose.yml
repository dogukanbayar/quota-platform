name: quota-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quota_platform
      POSTGRES_USER: ${DB_USER:-quota}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quota}
    ports:
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d quota_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quota_platform
      DB_USER: ${DB_USER:-quota}
      DB_PASSWORD: ${DB_PASSWORD:-quota}
      SERVER_PORT: "8085"
    ports:
      - "${APP_PORT:-8085}:8085"
    profiles: ["app"]

volumes:
  pgdata:
